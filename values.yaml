replicaCount: 2

image:
  repository: zot.soh.re
  name: hey.soh.re
  tag: "v1.0.6"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  name: hey-soh-re

resources: {}

name: webapp

# New section for the external secret
secret:
  enabled: false
  name: my-external-secret  # Name of the existing secret

postgres:
  enabled: false
  name: postgres-cluster
  instances: 2
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: app
      owner: app

redis:
  enabled: false
  name: redis
  replicas: 1
  port: 6379
  image:
    repository: cgr.dev/chainguard
    name: redis
    tag: latest
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
  resources: {}
  # When true, set REDIS_URL on the webapp container (redis://NAME:PORT/0).
  injectEnv: false

# ConfigMap section - user can define which configmaps to mount
configMaps: []
  # - name: custom-configmap
  #   mountPath: "/var/www/html"
  #   data:
  #     index.php: |
  #       <?php
  #       #$ip = getenv("REMOTE_ADDR");
  #       $ip = getenv('HTTP_X_FORWARDED_FOR');
  #       print 'Your IP is '.$ip.' Want to fight about it?';
  #       echo "\n";
  #       ?>

env: {}
  #REPO_URL: jmainguy.com

# Environment variables sourced from individual keys in existing Secrets.
secretEnv: {}
  # DATABASE_URL:
  #   name: postgres-cluster-app
  #   key: uri
  #   optional: false

# Persistence: list of volumes to mount. Each item can create a new PVC or use an existing one.
persistence: []
  # - name: data                    # Volume name (used as volume mount name)
  #   mountPath: /data              # Where to mount in the container
  #   size: 1Gi                     # Size when creating a new PVC (omit if using existingClaim)
  #   accessMode: ReadWriteMany      # Optional: PVC access mode (for example, ReadWriteOnce)
  #   existingClaim: ""             # Optional: name of existing PVC to use (do not create one)
  #   volumeName: ""                # Optional: when creating PVC, bind to this existing PV by name

virtualService:
  hosts:
    - "hey.soh.re"
  #  - "www.hey.soh.re"
  #redirectToPrimary: true    # Redirect www.HOSTNAME to HOSTNAME
